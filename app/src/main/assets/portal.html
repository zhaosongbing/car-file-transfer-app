<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>车机文件互传</title>
<style>
  :root{
    --blue:#0064E0; --white:#fff; --surface:#F1F4F7; --line:#DEE3E9; --line2:#8591A4;
    --ink:#0A1317; --title:#1C1E21; --gray:#5D6C7B; --red:#E41E3F; --green:#31A24C;
    --amber:#F2A918; --purple:#A121CE; --blue-bg:#E6F3FF;
    --r-card:24px; --r-sm:16px; --r-pill:9999px;
    --gap-select:12px; --gap-list:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:24px}
  .wrap{max-width:430px;margin:0 auto;padding:16px 18px;display:flex;flex-direction:column;gap:var(--gap-select)}
  .wrap.g14{gap:var(--gap-list)}
  .head .t{font-size:22px;font-weight:700}
  .head .s{font-size:13px;color:var(--gray);margin-top:4px}
  .conn{background:#fff;border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:8px}
  .conn .ch{display:flex;align-items:center;gap:10px}
  .conn .ch .ci{width:22px;height:22px;flex:none}
  .conn .ch .ct{font-size:16px;font-weight:700}
  .conn .cs{font-size:12px;color:var(--gray)}
  .tabs{display:flex;background:#fff;border-radius:var(--r-pill);padding:4px;gap:4px}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:var(--r-pill);font-size:14px;
       font-weight:600;color:var(--gray);cursor:pointer}
  .tab.on{background:var(--blue);color:#fff}
  .pick{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;
        background:var(--blue-bg);color:var(--blue);font-size:14px;font-weight:500;cursor:pointer}
  .sec{display:flex;align-items:center;justify-content:space-between}
  .sec .st{font-size:15px;font-weight:600;color:var(--ink)}
  .sec .sa{font-size:13px;font-weight:500;color:var(--blue);cursor:pointer}
  .sec .sa.dim{color:var(--gray)}

  /* list containers: the design draft spaces rows 12dp on the picker and
     14dp on the sending / done screens */
  .list{display:flex;flex-direction:column;gap:var(--gap-select)}
  .list.g14{gap:var(--gap-list)}

  .row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-radius:var(--r-sm)}
  .row.p12{padding:12px 14px}
  .tb{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;
      justify-content:center;color:#fff;font-weight:700;font-size:13px}
  .row .pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .row .pin{font-size:14px;font-weight:500;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .pis{font-size:12px;color:var(--gray)}
  .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:#fff;flex:none;
       display:flex;align-items:center;justify-content:center;color:#fff}
  .chk.on{background:var(--blue);border-color:var(--blue)}
  .chk svg{width:12px;height:12px}
  .okdot{width:18px;height:18px;border-radius:50%;background:var(--green);display:flex;
         align-items:center;justify-content:center;color:#fff;flex:none}
  .okdot svg{width:10px;height:10px}
  .state{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;flex:none}
  .state.sending{color:var(--blue)} .state.done{color:var(--green)}
  .state.wait{color:var(--gray)} .state.err{color:var(--red)}

  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 20px 20px;
       display:flex;align-items:center;justify-content:space-between;gap:12px;
       box-shadow:0 -2px 12px rgba(10,19,23,.06)}
  .bar .bi{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{padding:12px 28px;border-radius:var(--r-pill);border:none;background:var(--blue);
       color:#fff;font-size:16px;font-weight:700;flex:none}
  .btn:disabled{background:var(--line);color:var(--gray)}
  .btn.wide{width:100%;text-align:center}
  .btn.ghost{background:#fff;color:var(--gray);border:1px solid var(--line2);font-size:15px;font-weight:500}

  .prog-card{background:#fff;border-radius:var(--r-card);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
  .prog-card .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .prog-card .pct{font-size:34px;font-weight:700;color:var(--blue);line-height:1}
  .prog-card .pnum{font-size:12px;color:var(--gray)}
  .track{width:100%;height:8px;border-radius:var(--r-pill);background:var(--blue-bg);overflow:hidden}
  .fill{height:100%;width:0%;background:var(--blue);border-radius:var(--r-pill);transition:width .2s}
  .cur{display:flex;align-items:center;gap:10px}
  .spin{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--blue-bg);border-top-color:var(--blue);
        animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cur .cn{font-size:13px;font-weight:500;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rate{font-size:12px;color:var(--gray)}

  .ok-card{background:#fff;border-radius:var(--r-card);padding:24px 16px;display:flex;
           flex-direction:column;align-items:center;gap:10px}
  .ok-check{width:44px;height:44px;border-radius:50%;background:var(--green);display:flex;
            align-items:center;justify-content:center;color:#fff}
  .ok-card .ot{font-size:22px;font-weight:700}
  .ok-card .os{font-size:13px;color:var(--gray);text-align:center}
  .recv{background:var(--blue-bg);border-radius:var(--r-sm);padding:14px 16px;text-align:center;
        color:var(--blue);font-size:13px;font-weight:500}
  .empty{padding:36px 0;text-align:center;color:var(--gray);font-size:14px;line-height:1.7}
  .spacer{height:88px}
  .hidden{display:none !important}
  input[type=file]{display:none}
</style>
</head>
<body>

<!-- ============ shared header ============ -->
<div class="wrap">
  <div class="head"><div class="t">文件互传</div><div class="s">扫码连接 · 双向互传</div></div>
  <div class="conn">
    <div class="ch">
      <svg class="ci" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#31A24C"/><polyline points="7,12.4 10.5,16 17,9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="ct">已连接到 <span id="devName">车机</span></div>
    </div>
    <div class="cs">局域网直连 · 浏览器扫码即传</div>
  </div>
  <div class="tabs">
    <div class="tab on" data-view="send">发送到车机</div>
    <div class="tab" data-view="recv">从车机下载</div>
  </div>
</div>

<!-- ============ tab 1: upload to the car unit ============ -->
<div class="wrap" id="viewSelect">
  <label class="pick">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    选择文件
    <input type="file" id="fileInput" multiple />
  </label>
  <div class="sec"><div class="st">选择要发送的文件</div><div class="sa" id="toggleAll" style="display:none">全选</div></div>
  <div class="list" id="fileList"></div>
  <div class="empty" id="emptyTip">还没有选择文件<br/>点击上方「选择文件」从手机中挑选</div>
</div>

<div class="wrap g14 hidden" id="viewSending">
  <div class="head"><div class="t">文件互传</div><div class="s">正在发送 · 向 <span class="devSpan">车机</span></div></div>
  <div class="prog-card">
    <div class="top"><div class="pct" id="pctText">0%</div><div class="pnum" id="pnumText">已发送 0 B / 0 B</div></div>
    <div class="track"><div class="fill" id="fillBar"></div></div>
    <div class="cur"><div class="spin" id="spinIcon"></div><div class="cn" id="curName">准备中…</div></div>
    <div class="rate" id="rateText">正在建立连接…</div>
  </div>
  <div class="sec"><div class="st">发送队列</div><div class="sa dim" id="queueCount">0 项</div></div>
  <div class="list g14" id="queueList"></div>
</div>

<div class="wrap g14 hidden" id="viewDone">
  <div class="head"><div class="t">文件互传</div><div class="s">发送完成</div></div>
  <div class="ok-card">
    <div class="ok-check"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 6"/></svg></div>
    <div class="ot">发送完成</div>
    <div class="os" id="doneSummary">—</div>
  </div>
  <div class="recv" id="doneRecv">已成功发送至 车机</div>
  <div class="sec"><div class="st">本次发送</div><div class="sa dim" id="doneCount">0 项</div></div>
  <div class="list g14" id="doneList"></div>
</div>

<!-- ============ tab 2: download from the car unit ============ -->
<div class="wrap g14 hidden" id="viewRecv">
  <div class="sec">
    <div class="st">车机上的文件</div>
    <div class="sa" id="recvAll">下载全部</div>
  </div>
  <div class="list g14" id="recvList"></div>
  <div class="empty hidden" id="recvEmpty">车机上还没有文件<br/>先从「发送到车机」上传几个吧</div>
</div>

<div class="bar" id="bottomBar">
  <div class="bi" id="selInfo">已选 0 项 · 0 B</div>
  <button class="btn" id="sendBtn" disabled>发送</button>
</div>
<div class="spacer"></div>

<script>
(function(){
  var TYPE = {apk:'APK',zip:'ZIP',rar:'ZIP','7z':'ZIP',pdf:'PDF',png:'PNG',jpg:'PNG',jpeg:'PNG',gif:'PNG',webp:'PNG',
              mp4:'MP4',mkv:'MP4',avi:'MP4',mov:'MP4',doc:'DOC',docx:'DOC',txt:'DOC'};
  var COLOR = {APK:'var(--blue)',ZIP:'var(--amber)',PDF:'var(--red)',PNG:'var(--green)',MP4:'var(--purple)',DOC:'var(--gray)',FILE:'var(--gray)'};

  var files = [];          // upload queue: {file, on, name, size}
  var remote = [];         // download queue: {name, size, time, type, on}
  var sending = false, doneInited = false, tab = 'send';
  var xhr = null, aborted = false, t0 = 0;

  var $ = function(id){ return document.getElementById(id); };
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 6"/></svg>';

  function typeOf(n){
    var i = n.lastIndexOf('.');
    var e = (i>=0 ? n.substring(i+1) : '').toLowerCase();
    return TYPE[e] || 'FILE';
  }
  function fmt(b){
    if(b < 1024) return b + ' B';
    if(b < 1048576) return (b/1024).toFixed(1) + ' KB';
    if(b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
    return (b/1073741824).toFixed(2) + ' GB';
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function rowHtml(type, name, sub){
    return '<div class="tb" style="background:'+COLOR[type]+'">'+type+'</div>' +
           '<div class="pi"><div class="pin">'+escapeHtml(name)+'</div><div class="pis">'+sub+'</div></div>';
  }

  fetch('info').then(function(r){return r.json();}).then(function(d){
    if(d && d.device){
      $('devName').textContent = d.device;
      var spans = document.querySelectorAll('.devSpan');
      for(var i=0;i<spans.length;i++) spans[i].textContent = d.device;
      $('doneRecv').textContent = '已成功发送至 ' + d.device;
    }
  }).catch(function(){});

  /* ---------------------------------------------------------- bottom bar */
  function syncBar(){
    var bar = $('bottomBar'), btn = $('sendBtn');
    bar.classList.remove('hidden');
    if(tab === 'recv'){
      var sel = remote.filter(function(f){return f.on;});
      var bytes = sel.reduce(function(a,f){return a+f.size;},0);
      $('selInfo').textContent = '已选 ' + sel.length + ' 项 · ' + fmt(bytes);
      btn.className = 'btn';
      btn.textContent = '下载到手机';
      btn.disabled = sel.length === 0;
      btn.onclick = downloadSelected;
    } else if(sending){
      $('selInfo').textContent = '正在发送，请保持页面打开';
      btn.className = 'btn ghost wide';
      btn.textContent = '取消发送';
      btn.disabled = false;
      btn.onclick = cancelSending;
    } else if(doneInited){
      $('selInfo').textContent = '可以再次选择文件发送';
      btn.className = 'btn';
      btn.textContent = '继续发送';
      btn.disabled = false;
      btn.onclick = function(){ location.reload(); };
    } else {
      var s = files.filter(function(f){return f.on;});
      var t = s.reduce(function(a,f){return a+f.size;},0);
      $('selInfo').textContent = '已选 ' + s.length + ' 项 · ' + fmt(t);
      btn.className = 'btn';
      btn.textContent = '发送';
      btn.disabled = s.length === 0;
      btn.onclick = startSending;
    }
  }

  function setTab(next){
    tab = next;
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      tabs[i].classList.toggle('on', tabs[i].getAttribute('data-view') === next);
    }
    var showSend = next === 'send';
    $('viewSelect').classList.toggle('hidden', !showSend || sending || doneInited);
    $('viewSending').classList.toggle('hidden', !(showSend && sending));
    $('viewDone').classList.toggle('hidden', !(showSend && doneInited && !sending));
    $('viewRecv').classList.toggle('hidden', next !== 'recv');
    if(next === 'recv') loadRemote();
    syncBar();
  }
  var tabEls = document.querySelectorAll('.tab');
  for(var i=0;i<tabEls.length;i++){
    tabEls[i].addEventListener('click', function(){ setTab(this.getAttribute('data-view')); });
  }

  /* ---------------------------------------------------------- upload */
  $('fileInput').addEventListener('change', function(e){
    var picked = Array.prototype.slice.call(e.target.files || []);
    picked.forEach(function(f){
      var dup = files.some(function(x){ return x.name===f.name && x.size===f.size; });
      if(!dup) files.push({file:f, on:true, name:f.name, size:f.size});
    });
    e.target.value = '';
    render();
  });

  $('toggleAll').addEventListener('click', function(){
    var allOn = files.length>0 && files.every(function(f){return f.on;});
    files.forEach(function(f){ f.on = !allOn; });
    render();
  });

  function render(){
    var list = $('fileList');
    list.innerHTML = '';
    files.forEach(function(f){
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = rowHtml(typeOf(f.name), f.name, fmt(f.size)) +
        '<div class="chk'+(f.on?' on':'')+'">'+(f.on?CHECK:'')+'</div>';
      row.addEventListener('click', function(){
        if(sending) return;
        f.on = !f.on; render();
      });
      list.appendChild(row);
    });
    $('emptyTip').style.display = files.length ? 'none' : 'block';
    $('toggleAll').style.display = files.length ? 'block' : 'none';
    syncBar();
  }

  function renderQueue(){
    var list = $('queueList');
    list.innerHTML = '';
    files.forEach(function(f){
      if(!f.on) return;
      var st = f.state || 'wait';
      var label = {wait:'等待中',sending:'发送中',done:'已完成',err:'失败'}[st];
      var row = document.createElement('div');
      row.className = 'row p12';
      row.innerHTML = rowHtml(typeOf(f.name), f.name, fmt(f.size)) +
        '<div class="state '+st+'">'+(st==='done'?'<span class="okdot">'+CHECK+'</span>':'')+label+'</div>';
      list.appendChild(row);
    });
    $('queueCount').textContent = files.filter(function(f){return f.on;}).length + ' 项';
  }

  function startSending(){
    var sel = files.filter(function(f){return f.on;});
    if(!sel.length || sending) return;
    sending = true; aborted = false; t0 = Date.now();
    sel.forEach(function(f){ f.state = 'wait'; });
    setTab('send');
    $('bottomBar').classList.remove('hidden');
    renderQueue();
    sendNext(0);
  }

  function cancelSending(){
    if(!sending) return;
    aborted = true;
    if(xhr){ try{ xhr.abort(); }catch(e){} }
    sending = false;
    $('spinIcon').style.display = 'none';
    setTab('send');
  }

  function sendNext(i){
    var sel = files.filter(function(f){return f.on;});
    if(aborted) return;
    if(i >= sel.length){ finish(); return; }
    var f = sel[i];
    f.state = 'sending';
    renderQueue();
    $('curName').textContent = '正在发送：' + f.name;

    var total = sel.reduce(function(a,x){return a+x.size;},0);
    var done = 0; for(var k=0;k<i;k++) done += sel[k].size;
    $('pnumText').textContent = '已发送 ' + fmt(done) + ' / ' + fmt(total);

    var started = Date.now();
    xhr = new XMLHttpRequest();
    xhr.open('POST', 'upload?name=' + encodeURIComponent(f.name), true);
    xhr.upload.onprogress = function(ev){
      if(!ev.lengthComputable) return;
      var pct = total ? Math.round((done+ev.loaded)*100/total) : 0;
      $('fillBar').style.width = pct + '%';
      $('pctText').textContent = pct + '%';
      $('pnumText').textContent = '已发送 ' + fmt(done+ev.loaded) + ' / ' + fmt(total);
      var secs = (Date.now()-started)/1000;
      if(secs > 0.4){
        var speed = ev.loaded/1048576/secs;
        var left = (total-done-ev.loaded)/1048576/speed;
        $('rateText').textContent = '约 ' + speed.toFixed(1) + ' MB/s · 预计剩余 ' +
          (left>0 ? Math.max(1, Math.round(left)) + ' 秒' : '即将完成');
      }
    };
    xhr.onload = function(){
      f.state = (xhr.status >= 200 && xhr.status < 300) ? 'done' : 'err';
      renderQueue(); sendNext(i+1);
    };
    xhr.onerror = function(){ f.state = 'err'; renderQueue(); sendNext(i+1); };
    xhr.send(f.file);
  }

  function finish(){
    sending = false;
    doneInited = true;
    var sel = files.filter(function(f){return f.on;});
    var okCount = sel.filter(function(f){return f.state==='done';}).length;
    var total = sel.reduce(function(a,f){return a+(f.state==='done'?f.size:0);},0);
    var secs = ((Date.now()-t0)/1000).toFixed(1);

    $('fillBar').style.width = '100%';
    $('pctText').textContent = '100%';
    $('doneSummary').textContent = okCount + ' 个文件 · ' + fmt(total) + ' · 用时 ' + secs + ' 秒';
    $('doneCount').textContent = sel.length + ' 项';

    var list = $('doneList');
    list.innerHTML = '';
    sel.forEach(function(f){
      var ok = f.state==='done';
      var row = document.createElement('div');
      row.className = 'row p12';
      row.innerHTML = rowHtml(typeOf(f.name), f.name, fmt(f.size)) +
        '<div class="state '+(ok?'done':'err')+'">'+(ok?'<span class="okdot">'+CHECK+'</span>':'')+(ok?'已完成':'失败')+'</div>';
      list.appendChild(row);
    });

    setTab('send');
  }

  /* ---------------------------------------------------------- download */
  function loadRemote(){
    fetch('files?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        remote = (list || []).map(function(o){
          return {name:o.name, size:o.size, time:o.time, type:o.type, on:false};
        });
        renderRemote();
      })
      .catch(function(){
        $('recvEmpty').classList.remove('hidden');
        $('recvEmpty').innerHTML = '读取车机文件失败<br/>请确认仍连接到车机热点或同一 Wi-Fi';
      });
  }

  function renderRemote(){
    var list = $('recvList');
    list.innerHTML = '';
    remote.forEach(function(f){
      var row = document.createElement('div');
      row.className = 'row p12';
      row.innerHTML = rowHtml(f.type, f.name, fmt(f.size) + ' · ' + escapeHtml(f.time||'')) +
        '<div class="chk'+(f.on?' on':'')+'">'+(f.on?CHECK:'')+'</div>';
      row.addEventListener('click', function(){ f.on = !f.on; renderRemote(); });
      list.appendChild(row);
    });
    var empty = remote.length === 0;
    $('recvEmpty').classList.toggle('hidden', !empty);
    if(empty) $('recvEmpty').innerHTML = '车机上还没有文件<br/>先从「发送到车机」上传几个吧';
    syncBar();
  }

  $('recvAll').addEventListener('click', function(){
    if(!remote.length) return;
    remote.forEach(function(f){ f.on = true; });
    downloadSelected();
  });

  function downloadSelected(){
    var sel = remote.filter(function(f){return f.on;});
    if(!sel.length) return;
    $('sendBtn').disabled = true;
    var i = 0;
    function next(){
      if(i >= sel.length){
        $('selInfo').textContent = '已保存 ' + sel.length + ' 个文件到「下载」目录';
        $('sendBtn').disabled = false;
        sel.forEach(function(f){ f.on = false; });
        renderRemote();
        return;
      }
      var name = sel[i].name;
      $('selInfo').textContent = '正在下载 ' + (i+1) + '/' + sel.length + ' · ' + name;
      saveOne(name);
      i++;
      setTimeout(next, 800);
    }
    next();
  }

  function saveOne(name){
    var a = document.createElement('a');
    a.href = 'download?name=' + encodeURIComponent(name);
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 400);
  }

  render();
  setTab('send');
})();
</script>
</body>
</html>
